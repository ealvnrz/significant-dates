# Significant Dates — data
# ----------------------------------------------------------------------------
# One entry per meeting. Order doesn't matter (the site sorts by date).
# Dates come from the official page in `source`; `checked` says when they were last verified.
# "format inferred" = the official page doesn't state it; guessed from the venue.
# Only closing dates go in `deadlines` (not "registration opens" / notifications),
# so the countdowns on the site always mean "time left to do something".
# The list starts in October 2026: meetings that ended earlier aren't recorded.
# `tentative: true` on a meeting = dates not confirmed by the organisers; on a deadline = the
# date is inferred (e.g. the page gives "October 9" with no year). Both show a "TBC" mark.
# `deadlineStatus`: published (recorded dates), unknown (no information recorded), or
# not-announced (only with explicit official evidence explained in `note`).
# Each deadline has one or more `types`: submission, registration, proposal, funding, housing, other.
# `note` = a caveat shown to visitors in the meeting's details.
# ----------------------------------------------------------------------------

